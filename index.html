<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARCANA FORGE（仮題）</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">

  <!-- ===== タイトル ===== -->
  <section id="screen-title" class="screen active">
    <div class="title-wrap">
      <div class="logo-emblem"><div class="anvil">⚒</div></div>
      <h1 class="logo">ARCANA FORGE</h1>
      <p class="subtitle"><span>札を鍛え、魂を刻め</span></p>
      <div class="menu">
        <button class="btn primary big" data-go="setup">⚔ 対戦する</button>
        <button class="btn big" data-go="forge">⚒ カード工房</button>
        <button class="btn big" data-go="builder">📚 デッキ構築</button>
        <button class="btn big" data-go="rules">📜 遊び方</button>
      </div>
      <p class="version">prototype v0.4</p>
    </div>
  </section>

  <!-- ===== 対戦の準備 ===== -->
  <section id="screen-setup" class="screen">
    <div class="screen-head"><button class="btn ghost" data-go="title">◀ 戻る</button><h2>対戦の準備</h2></div>
    <div class="setup panel ornate">
      <div class="setup-row">
        <h3>あなたのデッキ</h3>
        <div id="setup-decks" class="deck-tiles"></div>
      </div>
      <div class="setup-row">
        <h3>CPUの強さ</h3>
        <div id="setup-level" class="seg"></div>
        <p class="hint">CPUは毎回、その場でオリジナルカードを鍛えてデッキを組みます。</p>
      </div>
      <div class="setup-foot"><button class="btn primary big" id="btn-start">対戦開始</button></div>
    </div>
  </section>

  <!-- ===== 対戦 ===== -->
  <section id="screen-battle" class="screen">
    <div class="board" id="board">
      <div class="pbar op" id="pbar-1"></div>
      <div class="field op" id="field-1"></div>
      <div class="midline">
        <div class="turn-info" id="turn-info"></div>
        <div class="mid-buttons">
          <button class="btn" id="btn-attack">アタックへ ▶</button>
          <button class="btn primary" id="btn-end">ターン終了</button>
          <button class="btn icon" id="btn-menu" title="メニュー">☰</button>
        </div>
      </div>
      <div class="field me" id="field-0"></div>
      <div class="pbar me" id="pbar-0"></div>
      <div class="hand" id="hand"></div>
      <div class="feed" id="feed"></div>
    </div>
    <div class="guide" id="guide"></div>
  </section>

  <!-- ===== カード工房 ===== -->
  <section id="screen-forge" class="screen">
    <div class="screen-head"><button class="btn ghost" data-go="title">◀ 戻る</button><h2>カード工房</h2><p class="head-hint">素質を引いて、容量の中で自由にカードを作る</p></div>
    <div class="forge">
      <div class="forge-left panel">
        <div class="fl-head"><h3>作ったカード</h3><span id="forge-count"></span></div>
        <div id="forge-list" class="mini-list"></div>
        <div class="fl-foot">
          <button class="btn small" id="forge-import">カードコードを読み込む</button>
        </div>
      </div>
      <div class="forge-main panel ornate" id="forge-main"></div>
      <div class="forge-right">
        <div id="forge-preview" class="forge-preview"></div>
        <div id="forge-meter" class="meter"></div>
        <div id="forge-errors" class="forge-errors"></div>
        <div class="forge-actions">
          <button class="btn primary" id="forge-save">工房に保存</button>
          <button class="btn" id="forge-new">新しく作る</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== デッキ構築 ===== -->
  <section id="screen-builder" class="screen">
    <div class="screen-head"><button class="btn ghost" data-go="title">◀ 戻る</button><h2>デッキ構築</h2>
      <div class="seg" id="pool-tabs"></div>
      <div class="seg" id="pool-kind"></div>
    </div>
    <div class="builder">
      <div class="pool-wrap panel"><div id="pool" class="card-grid"></div></div>
      <div class="deck-side panel ornate">
        <div class="deck-top">
          <select id="deck-select"></select>
          <button class="btn small" id="deck-new">新規</button>
        </div>
        <input id="deck-name" placeholder="デッキ名" maxlength="20">
        <div class="deck-count" id="deck-count"></div>
        <div class="curve" id="deck-curve"></div>
        <ul class="deck-list" id="deck-list"></ul>
        <div class="deck-error" id="deck-error"></div>
        <div class="deck-buttons">
          <button class="btn small" id="deck-clear">全て外す</button>
          <button class="btn small danger" id="deck-delete">削除</button>
          <button class="btn small primary" id="deck-save">保存</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== 遊び方 ===== -->
  <section id="screen-rules" class="screen">
    <div class="screen-head"><button class="btn ghost" data-go="title">◀ 戻る</button><h2>遊び方</h2></div>
    <div class="rules">
      <nav class="rules-nav panel" id="rules-nav"></nav>
      <div class="rules-page panel ornate" id="rules-page"></div>
    </div>
  </section>

  <div class="fx" id="fx"></div>
  <div class="modal" id="modal"></div>
  <div class="toast" id="toast"></div>
</div>

<script src="js/parts.js"></script>
<script src="js/cards.js"></script>
<script src="js/engine.js"></script>
<script src="js/ai.js"></script>
<script src="js/storage.js"></script>
<script src="js/decks.js"></script>
<script src="js/ui-common.js"></script>
<script src="js/battle.js"></script>
<script src="js/forge-ui.js"></script>
<script src="js/builder.js"></script>
<script src="js/rules.js"></script>
<script src="js/main.js"></script>
</body>
</html>
